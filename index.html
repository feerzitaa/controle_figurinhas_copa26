<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Figurinhas - Copa 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-card { background: #f0f4ff; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #e0e7ff; }
        .stat-card .number { font-size: 24px; font-weight: bold; color: #667eea; }
        .stat-card .label { font-size: 12px; color: #666; margin-top: 5px; }
        .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.3s; }
        button:hover { background: #764ba2; }
        button.secondary { background: #f0f4ff; color: #667eea; border: 1px solid #667eea; }
        button.secondary:hover { background: #e0e7ff; }
        .groups-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .group { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .group-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; font-weight: bold; font-size: 16px; }
        .group-content { padding: 15px; }
        .country { margin-bottom: 20px; }
        .country-name { font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        .progress-bar { background: #e0e7ff; height: 6px; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); height: 100%; transition: width 0.3s; }
        .figurinhas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .figurinha { position: relative; cursor: pointer; }
        .figurinha input[type="checkbox"] { display: none; }
        .figurinha-label { display: flex; align-items: center; justify-content: center; width: 100%; padding: 6px; background: #f0f4ff; border: 1px solid #d0d8ff; border-radius: 4px; font-size: 11px; font-weight: 600; color: #666; transition: all 0.2s; }
        .figurinha input[type="checkbox"]:checked + .figurinha-label { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; font-weight: bold; }
        .figurinha input[type="checkbox"]:checked + .figurinha-label::before { content: '✓ '; margin-right: 2px; }
        @media (max-width: 768px) { .groups-container { grid-template-columns: 1fr; } .figurinhas-grid { grid-template-columns: repeat(4, 1fr); } .header h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Controle de Figurinhas - Copa 2026</h1>
            <p style="color: #666; margin-top: 5px;">Marca quais figurinhas você já tem</p>
            <div class="stats">
                <div class="stat-card"><div class="number" id="totalCount">0</div><div class="label">Figurinhas</div></div>
                <div class="stat-card"><div class="number" id="haveCount">0</div><div class="label">Tem</div></div>
                <div class="stat-card"><div class="number" id="missingCount">0</div><div class="label">Faltam</div></div>
                <div class="stat-card"><div class="number" id="percentCount">0%</div><div class="label">Completo</div></div>
            </div>
            <div class="controls">
                <button onclick="marcarTodos()">Marcar Tudo</button>
                <button onclick="limparTudo()">Limpar Tudo</button>
                <button class="secondary" onclick="gerarPDF()">📥 Gerar PDF</button>
            </div>
        </div>
        <div class="groups-container" id="groupsContainer"></div>
    </div>

Bélgica":["BEL1","BEL2","BEL3","BEL4","BEL5","BEL6","BEL7","BEL8","BEL9","BEL10","BEL11","BEL12","BEL13","BEL14","BEL15","BEL16","BEL17","BEL18","BEL19","BEL20"],"Egito":["EGY1","EGY2","EGY3","EGY4","EGY5","EGY6","EGY7","EGY8","EGY9","EGY10","EGY11","EGY12","EGY13","EGY14","EGY15","EGY16","EGY17","EGY18","EGY19","EGY20"],"Irã":["IRN1","IRN2","IRN3","IRN4","IRN5","IRN6","IRN7","IRN8","IRN9","IRN10","IRN11","IRN12","IRN13","IRN14","IRN15","IRN16","IRN17","IRN18","IRN19","IRN20"],"Nova Zelândia":["NZL1","NZL2","NZL3","NZL4","NZL5","NZL6","NZL7","NZL8","NZL9","NZL10","NZL11","NZL12","NZL13","NZL14","NZL15","NZL16","NZL17","NZL18","NZL19","NZL20"]},"H":{"Espanha":["ESP1","ESP2","ESP3","ESP4","ESP5","ESP6","ESP7","ESP8","ESP9","ESP10","ESP11","ESP12","ESP13","ESP14","ESP15","ESP16","ESP17","ESP18","ESP19","ESP20"],"Cabo Verde":["CPV1","CPV2","CPV3","CPV4","CPV5","CPV6","CPV7","CPV8","CPV9","CPV10","CPV11","CPV12","CPV13","CPV14","CPV15","CPV16","CPV17","CPV18","CPV19","CPV20"],"Arábia Saudita":["KSA1","KSA2","KSA3","KSA4","KSA5","KSA6","KSA7","KSA8","KSA9","KSA10","KSA11","KSA12","KSA13","KSA14","KSA15","KSA16","KSA17","KSA18","KSA19","KSA20"],"Uruguai":["URU1","URU2","URU3","URU4","URU5","URU6","URU7","URU8","URU9","URU10","URU11","URU12","URU13","URU14","URU15","URU16","URU17","URU18","URU19","URU20"]},"I":{"França":["FRA1","FRA2","FRA3","FRA4","FRA5","FRA6","FRA7","FRA8","FRA9","FRA10","FRA11","FRA12","FRA13","FRA14","FRA15","FRA16","FRA17","FRA18","FRA19","FRA20"],"Senegal":["SEN1","SEN2","SEN3","SEN4","SEN5","SEN6","SEN7","SEN8","SEN9","SEN10","SEN11","SEN12","SEN13","SEN14","SEN15","SEN16","SEN17","SEN18","SEN19","SEN20"],"Iraque":["IRQ1","IRQ2","IRQ3","IRQ4","IRQ5","IRQ6","IRQ7","IRQ8","IRQ9","IRQ10","IRQ11","IRQ12","IRQ13","IRQ14","IRQ15","IRQ16","IRQ17","IRQ18","IRQ19","IRQ20"],"Noruega":["NOR1","NOR2","NOR3","NOR4","NOR5","NOR6","NOR7","NOR8","NOR9","NOR10","NOR11","NOR12","NOR13","NOR14","NOR15","NOR16","NOR17","NOR18","NOR19","NOR20"]},"J":{"Argentina":["ARG1","ARG2","ARG3","ARG4","ARG5","ARG6","ARG7","ARG8","ARG9","ARG10","ARG11","ARG12","ARG13","ARG14","ARG15","ARG16","ARG17","ARG18","ARG19","ARG20"],"Argélia":["ALG1","ALG2","ALG3","ALG4","ALG5","ALG6","ALG7","ALG8","ALG9","ALG10","ALG11","ALG12","ALG13","ALG14","ALG15","ALG16","ALG17","ALG18","ALG19","ALG20"],"Áustria":["AUT1","AUT2","AUT3","AUT4","AUT5","AUT6","AUT7","AUT8","AUT9","AUT10","AUT11","AUT12","AUT13","AUT14","AUT15","AUT16","AUT17","AUT18","AUT19","AUT20"],"Jordânia":["JOR1","JOR2","JOR3","JOR4","JOR5","JOR6","JOR7","JOR8","JOR9","JOR10","JOR11","JOR12","JOR13","JOR14","JOR15","JOR16","JOR17","JOR18","JOR19","JOR20"]},"K":{"Portugal":["POR1","POR2","POR3","POR4","POR5","POR6","POR7","POR8","POR9","POR10","POR11","POR12","POR13","POR14","POR15","POR16","POR17","POR18","POR19","POR20"],"Congo":["COD1","COD2","COD3","COD4","COD5","COD6","COD7","COD8","COD9","COD10","COD11","COD12","COD13","COD14","COD15","COD16","COD17","COD18","COD19","COD20"],"Uzbequistão":["UZB1","UZB2","UZB3","UZB4","UZB5","UZB6","UZB7","UZB8","UZB9","UZB10","UZB11","UZB12","UZB13","UZB14","UZB15","UZB16","UZB17","UZB18","UZB19","UZB20"],"Colômbia":["COL1","COL2","COL3","COL4","COL5","COL6","COL7","COL8","COL9","COL10","COL11","COL12","COL13","COL14","COL15","COL16","COL17","COL18","COL19","COL20"]},"L":{"Inglaterra":["ENG1","ENG2","ENG3","ENG4","ENG5","ENG6","ENG7","ENG8","ENG9","ENG10","ENG11","ENG12","ENG13","ENG14","ENG15","ENG16","ENG17","ENG18","ENG19","ENG20"],"Croácia":["CRO1","CRO2","CRO3","CRO4","CRO5","CRO6","CRO7","CRO8","CRO9","CRO10","CRO11","CRO12","CRO13","CRO14","CRO15","CRO16","CRO17","CRO18","CRO19","CRO20"],"Gana":["GHA1","GHA2","GHA3","GHA4","GHA5","GHA6","GHA7","GHA8","GHA9","GHA10","GHA11","GHA12","GHA13","GHA14","GHA15","GHA16","GHA17","GHA18","GHA19","GHA20"],"Panamá":["PAN1","PAN2","PAN3","PAN4","PAN5","PAN6","PAN7","PAN8","PAN9","PAN10","PAN11","PAN12","PAN13","PAN14","PAN15","PAN16","PAN17","PAN18","PAN19","PAN20"]},"EXTRAS":{"Coca-Cola":["CC1","CC2","CC3","CC4","CC5","CC6","CC7","CC8","CC9","CC10","CC11","CC12","CC13","CC14"]}};

        function construirInterface() {
            const container = document.getElementById('groupsContainer');
            for (const [grupo, paises] of Object.entries(dados)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group';
                let html = '<div class="group-header">Grupo ' + grupo + '</div><div class="group-content">';
                for (const [pais, figurinhas] of Object.entries(paises)) {
                    const countTem = figurinhas.filter(f => localStorage.getItem(f) === 'true').length;
                    const percentual = figurinhas.length > 0 ? Math.round((countTem / figurinhas.length) * 100) : 0;
                    html += '<div class="country"><div class="country-name">' + pais + ' (' + countTem + '/' + figurinhas.length + ')</div><div class="progress-bar"><div class="progress-fill" style="width: ' + percentual + '%"></div></div><div class="figurinhas-grid">';
                    figurinhas.forEach(function(fig) {
                        const isChecked = localStorage.getItem(fig) === 'true';
                        html += '<div class="figurinha"><input type="checkbox" id="' + fig + '" ' + (isChecked ? 'checked' : '') + ' onchange="atualizarStats()"><label for="' + fig + '" class="figurinha-label">' + fig.slice(-2) + '</label></div>';
                    });
                    html += '</div></div>';
                }
                html += '</div>';
                groupDiv.innerHTML = html;
                container.appendChild(groupDiv);
            }
            atualizarStats();
        }

        function atualizarStats() {
            let total = 0, tem = 0;
            for (const paises of Object.values(dados)) {
                for (const figurinhas of Object.values(paises)) {
                    total += figurinhas.length;
                    figurinhas.forEach(function(fig) {
                        const checkbox = document.getElementById(fig);
                        if (checkbox && checkbox.checked) {
                            localStorage.setItem(fig, 'true');
                            tem++;
                        } else {
                            localStorage.removeItem(fig);
                        }
                    });
                }
            }
            const faltam = total - tem;
            const percentual = total > 0 ? Math.round((tem / total) * 100) : 0;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('haveCount').textContent = tem;
            document.getElementById('missingCount').textContent = faltam;
            document.getElementById('percentCount').textContent = percentual + '%';
        }

        function marcarTodos() {
            for (const paises of Object.values(dados)) {
                for (const figurinhas of Object.values(paises)) {
                    figurinhas.forEach(function(fig) {
                        const checkbox = document.getElementById(fig);
                        if (checkbox) checkbox.checked = true;
                    });
                }
            }
            atualizarStats();
        }

        function limparTudo() {
            for (const paises of Object.values(dados)) {
                for (const figurinhas of Object.values(paises)) {
                    figurinhas.forEach(function(fig) {
                        const checkbox = document.getElementById(fig);
                        if (checkbox) checkbox.checked = false;
                    });
                }
            }
            atualizarStats();
        }

        function gerarPDF() {
            let html = '<html><head><meta charset="utf-8"><title>Figurinhas Copa 2026</title><style>body{font-family:Arial;margin:20px}h2{margin-top:30px}table{margin:20px 0;border-collapse:collapse;font-size:10px}th{background:#667eea;color:white;padding:6px;border:1px solid #ccc}td{padding:6px;border:1px solid #ccc;text-align:center}.country-col{text-align:left;font-weight:bold;background:#f0f4ff}.have{background:#c8e6c9}.dont-have{background:#ffcdd2}</style></head><body><h1>Controle de Figurinhas - Copa 2026</h1>';
            for (const [grupo, paises] of Object.entries(dados)) {
                html += '<h2>Grupo ' + grupo + '</h2><table><thead><tr><th>País</th>';
                const maxFigs = Math.max(...Object.values(paises).map(f => f.length));
                for (let i = 1; i <= maxFigs; i++) {
                    html += '<th>' + String(i).padStart(2, '0') + '</th>';
                }
                html += '</tr></thead><tbody>';
                for (const [pais, figurinhas] of Object.entries(paises)) {
                    html += '<tr><td class="country-col">' + pais + '</td>';
                    figurinhas.forEach(function(fig) {
                        const temFig = localStorage.getItem(fig) === 'true';
                        html += '<td class="' + (temFig ? 'have' : 'dont-have') + '">' + (temFig ? '✓' : '') + '</td>';
                    });
                    for (let i = figurinhas.length; i < maxFigs; i++) {
                        html += '<td></td>';
                    }
                    html += '</tr>';
                }
                html += '</tbody></table>';
            }
            html += '</body></html>';
            const newWindow = window.open();
            newWindow.document.write(html);
            newWindow.document.close();
            setTimeout(() => newWindow.print(), 250);
        }

        document.addEventListener('DOMContentLoaded', construirInterface);
    </script>
</body>
</html>
